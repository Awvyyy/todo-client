@if (auth.token()) {
  <header class="bar">
    <span>Logged in as <strong>{{ auth.username() }}</strong></span>
    <button type="button" class="secondary" (click)="logout()">Log out</button>
  </header>
  <app-tasks />
} @else {
  <main class="card">
    <h1>{{ mode() === 'login' ? 'Log in' : 'Create account' }}</h1>

    <form (ngSubmit)="submit()">
      <input
        [(ngModel)]="username"
        name="username"
        placeholder="Username"
        autocomplete="username"
        required/>

      @if (mode() === 'register') {
        <input [(ngModel)]="firstname" name="firstname" placeholder="First name" autocomplete="given-name"/>
        <input [(ngModel)]="lastname" name="lastname" placeholder="Last name" autocomplete="family-name"/>
      }

      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="Password"
        [autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
        required/>

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

      <button type="submit" [disabled]="busy()">
        {{ mode() === 'login' ? 'Log in' : 'Register' }}
      </button>
    </form>

    <p class="switch">
      {{ mode() === 'login' ? 'No account yet?' : 'Already have an account?' }}
      <button type="button" class="link" (click)="switchMode()">
        {{ mode() === 'login' ? 'Register' : 'Log in' }}
      </button>
    </p>
  </main>
}
